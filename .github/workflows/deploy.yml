name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          cd backend
          python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          npm ci
          npm test -- --watch=false --runInBand
          npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: forte-vps
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy release over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing secret: $name" >&2; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          git archive --format=tar HEAD | gzip > release.tar.gz
          ssh -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f /root/Forte/.env || { echo '/root/Forte/.env not found' >&2; exit 1; }; mkdir -p /root/Forte/releases/$GITHUB_SHA"
          scp -o StrictHostKeyChecking=yes -P "$VPS_PORT" release.tar.gz "$VPS_USER@$VPS_HOST:/root/Forte/releases/$GITHUB_SHA/release.tar.gz"
          ssh -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /root/Forte/releases/$GITHUB_SHA && tar -xzf release.tar.gz && ln -sfn /root/Forte/.env .env && docker compose -p forte -f compose.yaml -f compose.production.yaml up -d --build --wait --wait-timeout 180 --remove-orphans && ln -sfn /root/Forte/releases/$GITHUB_SHA /root/Forte/current"
