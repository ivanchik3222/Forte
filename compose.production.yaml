services:
  ml-worker:
    environment:
      ML_ENGINE: reviewed_pipeline
      DATABASE_URL: postgresql+psycopg://forte:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/forte
  backend:
    environment:
      ML_ENGINE: reviewed_pipeline
      DATABASE_URL: postgresql+psycopg://forte:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/forte
      COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forte
      POSTGRES_USER: forte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forte -d forte"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
