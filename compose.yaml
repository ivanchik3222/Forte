services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-6767}:6767"
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/database/database.db
      MEDIA_ROOT: /app/media
      DEMO_MODE: ${DEMO_MODE:-true}
      # Bundled Linux image uses YOLO. Full MLX pipeline runs natively on the Mac.
      ML_ENGINE: ${ML_ENGINE:-objects}
    volumes:
      - database:/app/database
      - media_data:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6767/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:6767}
        REACT_APP_DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ml-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.ml
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/database/database.db
      MEDIA_ROOT: /app/media
      ML_DEVICE: cpu
      ML_ENGINE: ${ML_ENGINE:-objects}
    volumes:
      - database:/app/database
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  media_data:
