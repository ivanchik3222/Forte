services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.ml
      target: api
    env_file: .env
    ports:
      - "${BACKEND_PORT:-6767}:6767"
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/database/database.db
      MEDIA_ROOT: /app/media
      DEMO_MODE: ${DEMO_MODE:-true}
      ML_ENGINE: ${ML_ENGINE:-reviewed_pipeline}
      # External Qwen is not provisioned yet. Positive R3D signals remain
      # explicitly unclassified; no clean verdict is possible without Qwen.
      ML_VLM_BACKEND: ${ML_VLM_BACKEND:-disabled}
      ML_REVIEWED_PYTHON: /usr/local/bin/python
      ML_REVIEWED_BUNDLE: /app/ML/deployment/reviewed/model_bundle.json
      ML_REVIEWED_BACKBONE: /app/ML/models/r3d_18-b3b3357e.pth
    volumes:
      - database:/app/database
      - media_data:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6767/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:6767}
        REACT_APP_DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ml-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.ml
      target: worker
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/database/database.db
      MEDIA_ROOT: /app/media
      ML_DEVICE: cpu
      ML_ENGINE: ${ML_ENGINE:-reviewed_pipeline}
      ML_VLM_BACKEND: ${ML_VLM_BACKEND:-disabled}
      ML_REVIEWED_PYTHON: /usr/local/bin/python
      ML_REVIEWED_BUNDLE: /app/ML/deployment/reviewed/model_bundle.json
      ML_REVIEWED_BACKBONE: /app/ML/models/r3d_18-b3b3357e.pth
    volumes:
      - database:/app/database
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  media_data:
